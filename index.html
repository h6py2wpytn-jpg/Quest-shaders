<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quest 3S Shader Sandbox</title>
  <!-- Load A-Frame framework for VR rendering -->
  <script src="https://aframe.io"></script>
  
  <style>
    /* Floating 2D control panel styling */
    #menu {
      position: absolute; top: 20px; left: 20px; z-index: 999;
      background: rgba(0,0,0,0.85); color: #fff; padding: 15px;
      border-radius: 8px; font-family: sans-serif; max-width: 250px;
    }
    button {
      display: block; width: 100%; margin: 8px 0; padding: 10px;
      background: #333; color: #fff; border: 1px solid #555;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #555; }
    input[type="color"] { width: 100%; height: 35px; border: none; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Floating Screen Menu -->
  <div id="menu">
    <h3>Camera Modes</h3>
    <button onclick="window.setMode(0)">1. Normal View</button>
    <button onclick="window.setMode(1)">2. Invert Colors</button>
    <button onclick="window.setMode(2)">3. Wobble Distortion</button>
    <button onclick="window.setMode(4)">4. Upside Down</button>
    <button onclick="window.setMode(5)">5. Continuous Spin</button>
    <p>3. Color Filter Hue Pick:</p>
    <input type="color" id="huePicker" value="#ff00ff" onchange="window.updateColor(this.value)">
    <p style="font-size: 11px; color: #aaa; margin-top: 10px;">
      Double-click the Right Controller 'A' button or main trigger to hide/show this panel in VR.
    </p>
  </div>

  <script>
    // Safe registration wrapper to ensure A-Frame exists before running
    if (typeof AFRAME !== 'undefined') {
      AFRAME.registerShader('quest-visor-shader', {
        schema: {
          src: {type: 'map', is: 'uniform'},
          mode: {type: 'int', default: 0, is: 'uniform'},
          filterColor: {type: 'color', default: '#ff00ff', is: 'uniform'},
          time: {type: 'time', is: 'uniform'}
        },
        vertexShader: `
          varying vec2 vUv;
          uniform int mode;
          uniform float time;
          void main() {
            vec2 uv = uv;
            if (mode == 4) {
              uv = vec2(1.0 - uv.x, 1.0 - uv.y);
            }
            if (mode == 5) {
              float angle = time * 0.001;
              vec2 center = vec2(0.5, 0.5);
              float s = sin(angle);
              float c = cos(angle);
              uv -= center;
              uv = vec2(uv.x * c - uv.y * s, uv.x * s + uv.y * c);
              uv += center;
            }
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform sampler2D src;
          uniform int mode;
          uniform vec3 filterColor;
          uniform float time;
          void main() {
            vec2 uv = vUv;
            if (mode == 2) {
              uv.x += sin(uv.y * 20.0 + time * 0.005) * 0.03;
              uv.y += cos(uv.x * 20.0 + time * 0.005) * 0.03;
            }
            vec4 texColor = texture2D(src, uv);
            if (mode == 1) {
              texColor.rgb = 1.0 - texColor.rgb;
            }
            if (mode == 3) {
              texColor.rgb *= filterColor;
            }
            gl_FragColor = texColor;
          }
        `
      });
    }
  </script>

  <!-- Setup WebXR Session for Roomscale tracking without floor grids popping up -->
  <a-scene webxr="referenceSpaceType: local-floor; requiredFeatures: local-floor;">
    <a-assets>
      <video id="webcam" autoplay playsinline crossorigin="anonymous" muted></video>
    </a-assets>

    <!-- Attach visor plane directly to the camera block -->
    <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false">
      <a-plane id="visor" 
               position="0 0 -1" 
               width="2.7" 
               height="1.6" 
               material="shader: quest-visor-shader; src: #webcam; depthTest: false;"
               scale="1 1 1">
      </a-plane>
    </a-camera>

    <!-- Track Controllers for the Double-Click Macro -->
    
  </a-scene>

  <script>
    // Wrap tracking logic in window load to guarantee elements exist before listening
    window.addEventListener('load', function () {
      const video = document.getElementById('webcam');
      const visor = document.getElementById('visor');
      const menu = document.getElementById('menu');
      const rightHand = document.getElementById('rightHand');
      
      let currentMode = 0;
      let lastClickTime = 0;

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: 1280, height: 720 } 
        })
        .then(stream => {
          video.srcObject = stream;
          video.play();
        })
        .catch(err => console.log("Camera init note: " + err));
      }

      // Attach functions to the global window space so buttons can find them safely
      window.setMode = function(modeNum) {
        currentMode = modeNum;
        if (visor) visor.setAttribute('material', 'mode', modeNum);
      }

      window.updateColor = function(hex) {
        window.setMode(3);
        const r = parseInt(hex.slice(1,3), 16) / 255;
        const g = parseInt(hex.slice(3,5), 16) / 255;
        const b = parseInt(hex.slice(5,7), 16) / 255;
        if (visor) visor.setAttribute('material', 'filterColor', {x: r, y: g, z: b});
      }

      function handleToggleEvent() {
        const now = performance.now();
        if (now - lastClickTime < 300) {
          if (menu) menu.classList.toggle('hidden');
        }
        lastClickTime = now;
      }

      if (rightHand) {
        rightHand.addEventListener('triggerdown', handleToggleEvent);
        rightHand.addEventListener('abuttondown', handleToggleEvent);
      }
    });
  </script>
</body>
</html>
